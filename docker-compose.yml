name: meumostruario

services:
  postgres:
    image: postgres:16
    container_name: mostruario-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: mostruario-redis
    # Persistencia explicita, e nao o padrao da imagem: aqui mora a fila do
    # Sidekiq, e fila perdida significa lote de fotos que nunca e analisado e
    # e-mail de pedido que nunca sai — sem erro em lugar nenhum.
    #
    # Sem maxmemory-policy de despejo, tambem de proposito: com allkeys-lru o
    # Redis descartaria as proprias filas para liberar memoria.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ruby:3.3
    container_name: mostruario-api
    working_dir: /app
    volumes:
      - ./api:/app
      - bundle_cache:/usr/local/bundle
    ports:
      - "8000:3000"
    env_file:
      - ./api/.env
    environment:
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      RAILS_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      bash -c "gem install bundler:4.0.6 --no-document &&
               bundle install &&
               bin/rails db:prepare &&
               mkdir -p public/assets &&
               bin/rails storefront:css &&
               bin/rails server -b 0.0.0.0"

volumes:
  postgres_data:
  redis_data:
  bundle_cache:

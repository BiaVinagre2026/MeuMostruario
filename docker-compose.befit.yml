name: befit

services:
  web:
    image: node:20-slim
    container_name: befit-web
    working_dir: /app
    ports:
      - "127.0.0.1:${BEFIT_WEB_PORT:-3000}:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: "${BEFIT_API_PROXY_TARGET:-http://host.docker.internal:8000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./web:/app
      - befit_node_modules:/app/node_modules
    command: >
      bash -c "npm install && npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  befit_node_modules:

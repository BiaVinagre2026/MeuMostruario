; Processos da imagem de producao: Sidekiq e Puma.
;
; O Redis NAO mora mais aqui. Ele subia neste mesmo container com
; `--appendonly no --save ""` e `--maxmemory-policy allkeys-lru`, o que
; significava duas perdas silenciosas: toda a fila do Sidekiq morria em
; qualquer restart do container, e sob pressao de memoria o proprio Redis
; despejava as filas para liberar espaco. Lote de fotos que nunca era
; analisado e e-mail de pedido que nunca saia, sem erro em lugar nenhum.
;
; Agora o Redis e servico externo, com persistencia, apontado por REDIS_URL.
;
; REDIS_URL tambem saiu das linhas `environment=` abaixo: fixado ali, ele
; sobrescrevia o valor passado ao container e a variavel de ambiente nao tinha
; efeito nenhum. Sem a chave listada, o processo herda o ambiente do container.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=warn

[program:sidekiq]
command=bundle exec sidekiq -C config/sidekiq.yml
directory=/rails
user=rails
autostart=true
autorestart=true
priority=20
startsecs=10
stopwaitsecs=20
stopsignal=TSTP
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/home/rails",PGSSLCERT="",PGSSLKEY=""

[program:puma]
command=bundle exec rails server -b 0.0.0.0 -p 3000
directory=/rails
user=rails
autostart=true
autorestart=true
priority=30
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=HOME="/home/rails",PGSSLCERT="",PGSSLKEY=""
